<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="homework.css">
</head>
<body>
    <!-- Header with the Home link and the profile picture -->
    <header>
        <a href="index.html">Home</a>
        <a class="logo" href="#"><img src="pic/nägu.jpg" width="50" height="50" alt="My picture"></a>
    </header>
    <!-- The login box -->
    <main class="login-container">
        <h2>Welcome to PostIt</h2>
        <!-- Blue text that should look like a link -->
        <p class="blue-text">Create an account</p>
        <p>or</p>
        <p>Please log in</p>

        <!-- Form with two fields and a log in button. 
            After a successful submit, the user goes to index.html -->
        <form action="index.html">
            <!-- required means that the form cannot be sent if this field is empty.
                 type="email" checks that the text looks like an email -->
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            
            <button type="submit">Log in</button>
        </form>
        <!-- Another blue text that should look like a link -->
        <p class="blue-text">Forgot password</p>
    </main>
</body>
</html>
